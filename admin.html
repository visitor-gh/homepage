<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 · (주)노금휀스철망</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ============================================================
       Header
       ============================================================ -->
  <header class="admin-header">
    <div class="container">
      <div class="brand">
        <span class="brand-mark">NK</span>
        <span class="brand-name">
          <strong>관리자 콘솔</strong>
          <small>NOGEUM FENCE · ADMIN</small>
        </span>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-secondary" target="_blank">
          <i class="fas fa-external-link-alt"></i> 사이트 보기
        </a>
      </div>
    </div>
  </header>

  <!-- ============================================================
       Main
       ============================================================ -->
  <main class="admin-main">
    <div class="container">

      <h1 class="page-title">대시보드</h1>
      <p class="page-subtitle">포트폴리오 이미지와 견적 문의를 관리합니다.</p>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-ico"><i class="fas fa-images"></i></div>
          <div>
            <div class="stat-num" id="totalImages">0</div>
            <div class="stat-label">Portfolio Images</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-ico"><i class="fas fa-file-invoice"></i></div>
          <div>
            <div class="stat-num" id="totalQuotes">0</div>
            <div class="stat-label">Total Quotes</div>
          </div>
        </div>
        <div class="stat-card accent">
          <div class="stat-ico"><i class="fas fa-clock"></i></div>
          <div>
            <div class="stat-num" id="pendingQuotes">0</div>
            <div class="stat-label">Pending Review</div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="images">
          <i class="fas fa-images"></i> 이미지 관리
        </button>
        <button class="tab-btn" data-tab="quotes">
          <i class="fas fa-file-invoice"></i> 견적 문의
        </button>
      </div>

      <!-- Images tab -->
      <div class="tab-content active" id="tab-images">
        <div class="tab-head">
          <div>
            <h2>포트폴리오 이미지</h2>
          </div>
          <button class="btn btn-primary" id="addImageBtn">
            <i class="fas fa-plus"></i> 이미지 추가
          </button>
        </div>

        <div class="filter-bar">
          <label>카테고리</label>
          <select id="categoryFilter" class="form-select">
            <option value="all">전체</option>
            <option value="factory">공장·산업시설</option>
            <option value="construction">건설현장</option>
            <option value="residential">주거시설</option>
            <option value="agricultural">농업시설</option>
          </select>
        </div>

        <div class="images-grid" id="imagesGrid"></div>
      </div>

      <!-- Quotes tab -->
      <div class="tab-content" id="tab-quotes">
        <div class="tab-head">
          <div>
            <h2>견적 문의</h2>
          </div>
        </div>

        <div class="filter-bar">
          <label>상태</label>
          <select id="statusFilter" class="form-select">
            <option value="all">전체</option>
            <option>접수완료</option>
            <option>검토중</option>
            <option>견적발송</option>
            <option>상담완료</option>
            <option>계약완료</option>
          </select>
        </div>

        <div class="table-wrap">
          <table class="quotes-table">
            <thead>
              <tr>
                <th>접수일</th>
                <th>회사명 / 이름</th>
                <th>연락처</th>
                <th>서비스</th>
                <th>지역</th>
                <th>상태</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="quotesBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- ============================================================
       Image modal
       ============================================================ -->
  <div class="modal" id="imageModal">
    <div class="modal-overlay" data-close></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="imageModalTitle">이미지 추가</h3>
        <button class="modal-close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <form id="imageForm">
          <input type="hidden" id="imageId" />
          <div class="form-group">
            <label>이미지 URL <span class="required">*</span></label>
            <input type="url" id="imageUrl" class="form-input" required placeholder="https://example.com/image.jpg" />
            <div class="hint">온라인에 업로드된 이미지의 URL을 입력하세요.</div>
          </div>
          <div class="form-group">
            <label>제목 <span class="required">*</span></label>
            <input type="text" id="imageTitle" class="form-input" required placeholder="예: ○○산업단지 철망휀스 시공" />
          </div>
          <div class="form-group">
            <label>설명 <span class="required">*</span></label>
            <textarea id="imageDescription" class="form-textarea" required placeholder="간단한 설명을 입력하세요"></textarea>
          </div>
          <div class="form-group">
            <label>카테고리 <span class="required">*</span></label>
            <select id="imageCategory" class="form-select" required>
              <option value="">선택해주세요</option>
              <option value="factory">공장·산업시설</option>
              <option value="construction">건설현장</option>
              <option value="residential">주거시설</option>
              <option value="agricultural">농업시설</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" data-close>취소</button>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save"></i> 저장
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- ============================================================
       Quote modal
       ============================================================ -->
  <div class="modal" id="quoteModal">
    <div class="modal-overlay" data-close></div>
    <div class="modal-content large">
      <div class="modal-header">
        <h3>견적 문의 상세</h3>
        <button class="modal-close" data-close><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div id="quoteDetail" class="quote-detail"></div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-close>닫기</button>
          <button type="button" class="btn btn-primary" id="saveQuoteStatus">
            <i class="fas fa-save"></i> 상태 저장
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMsg"></span>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
